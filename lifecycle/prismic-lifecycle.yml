sla:
  url: null
  note: >-
    No public SLA document is published (https://prismic.io/legal/sla returns
    404). An SLA is a plan-gated commitment: the pricing data marks `sla` as
    included only on Enterprise ("Support and uptime SLAs"), null on every
    self-serve tier. See plans/prismic-plans-pricing.yml.
  enterprise_only: true
support_lifecycle:
  frameworks_supported: [Next.js, Nuxt, SvelteKit]
  note: >-
    Framework support is announced as changelog entries (e.g. "Nuxt 4 support",
    2025-07-16) rather than governed by a published support matrix with end dates.
changelog: changelog/prismic-changelog.yml
