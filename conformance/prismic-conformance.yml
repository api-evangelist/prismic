generated: '2026-08-13'
method: searched
source: https://prismic.io/legal/security
note: >-
  Two different claims are recorded here and they should not be blurred.
  Prismic's SECURITY/COMPLIANCE posture is genuinely published and named
  (https://prismic.io/legal/security). Its API STANDARDS conformance is thin: no
  OpenAPI, no AsyncAPI, no RFC 9457, no rate-limit headers. The strong result is
  in the middle — the two OAuth discovery RFCs, which were verified live rather
  than claimed.
standards:
  # --- verified live -------------------------------------------------------
  - id: oauth2
    conforms: true
    evidence: >-
      Two independent OAuth surfaces. (1) The MCP server publishes RFC 8414
      authorization-server metadata with authorization_code + refresh_token
      grants and S256 PKCE. (2) Every Prismic repository advertises its own
      oauth_initiate/oauth_token endpoints in the Repository API root document.
    verified: probed
    artifact: authentication/prismic-authentication.yml
  - id: rfc8414-oauth-authorization-server-metadata
    conforms: true
    evidence: 'GET https://mcp.prismic.io/.well-known/oauth-authorization-server ->
      HTTP 200, valid metadata document'
    verified: probed
    file: well-known/prismic-mcp-oauth-authorization-server.json
  - id: rfc9728-oauth-protected-resource-metadata
    conforms: true
    evidence: 'GET https://mcp.prismic.io/.well-known/oauth-protected-resource -> HTTP
      200, {"resource":"https://mcp.prismic.io/mcp","authorization_servers":["https://mcp.prismic.io/"]}'
    verified: probed
    file: well-known/prismic-mcp-oauth-protected-resource.json
  - id: oauth2-dynamic-client-registration
    conforms: true
    evidence: registration_endpoint https://mcp.prismic.io/register advertised in the
