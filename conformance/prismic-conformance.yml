compliance:
  published: false
  url: https://prismic.io/legal/security
  certifications: []
  artifact: security/prismic-trust-center.yml
  note: >-
    Prismic publishes a detailed security PRACTICES page but holds no named
    certification of its own — no SOC 2, no ISO 27001, no PCI, no audited
    attestation of any kind. Every certification named on that page belongs to a
    third party and Prismic says so: ISO 27001/27017/27018, PCI-DSS L1, SOC 1/2/3
    and CSA STAR are listed as AWS's (its host), and PCI is explicitly outsourced
    to Stripe. A prior automated pass keyword-matched those names and credited
    them to Prismic; that is corrected in
    security/prismic-trust-center.yml. Consequently NO `Compliance` pointer is
    wired in apis.yml — the artifact records an honest absence, not a program.
  published_practices: [yearly external penetration tests, continuous vulnerability
      scanning, periodic external security audits, secure development lifecycle with
      peer review, annual employee security training, documented incident response
      plan, three-AZ redundancy with point-in-time recovery]
regulatory_context:
  gdpr: claimed on the security page; DPA not yet available online (Enterprise, via
    Account Manager)
  sso: Enterprise tier only (OAuth2 / AD / Okta)
  data_residency: AWS us-east-1 only — single region, no customer choice offered
  hipaa: not claimed
  fedramp: not claimed
  pci: outsourced to Stripe; Prismic is not a PCI entity
