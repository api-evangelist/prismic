api_relevant_observations:
  - >-
    Every tier including Free includes the Migration API, GraphQL, webhooks,
    Slice Machine and previews. Prismic does not gate its API surface by plan —
    it meters it. The paywall is quota, not capability.
  - >-
    The metered units are API calls and CDN bandwidth, and cached CDN reads count
    against neither the per-second rate limit nor the monthly call quota. A
    consumer's bill is therefore a function of cache-hit rate more than of
    request volume.
  - >-
    `ai_features` is "Upon request" on every self-serve tier — the AI capabilities
    Prismic markets heavily are not self-serve at any price below Enterprise
    contact.
  - >-
    No plan mentions the MCP server. MCP is activated per repository in settings
    with no stated plan requirement.
