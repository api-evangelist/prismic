generated: '2026-08-13'
method: probed
source: https://prismic.io/pricing
probe: >-
  Prismic runs prismic.io on a public Prismic repository, so its pricing table is
  readable as structured data from Prismic's OWN Content API rather than scraped
  from the rendered page:
  GET https://prismic-main.cdn.prismic.io/api/v2/documents/search
  ?ref=<master>&q=[[at(document.type,"pricing_plan")]] -> HTTP 200, 6 documents.
  Every price, quota and overage below is verbatim from the `pricing_plan`
  documents in that response, fetched 2026-08-13.
supersedes: plans/prismic-plans.md
supersedes_note: >-
  The prior plans/prismic-plans.md carried stale and partly wrong figures — it
  listed Starter at $10/month and Platinum at $675/month, when those are the
  ANNUAL-billing rates; the monthly rates are $15 and $750. It also omitted the
  Free tier's bandwidth allowance, all overage pricing, and the user and locale
  caps. Kept on disk for provenance; this file is the accurate one.
currency: USD
billing_periods: [monthly, annual]
billing_note: Prices carry two rates. `price_monthly` is month-to-month; `price_annual_per_month`
  is the discounted per-month rate on an annual commitment.
plan_count: 6
