note: >-
  Prismic's published package surface is JavaScript-first. The "API References"
  page (https://prismic.io/docs/apis.md) lists exactly the packages below as
  first-party and explicitly marks three as deprecated. The non-JavaScript kits
  (Python, Ruby, PHP, Java, Scala, Android) are still published on their
  registries and still reachable at github.com/prismicio, but Prismic no longer
  lists any of them on its API References page and none has shipped a release in
  years — the Python kit's last release predates the current Content API v2
  tooling by six years, and the Java/Scala/Android kits by eight to eleven.
  Every version/published pair below was read from the registry metadata
  endpoint on 2026-08-13.
